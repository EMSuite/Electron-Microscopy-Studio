# Adapted from mac4DSTEM (.github/workflows/ci.yml).
#
# CI — what a public checkout can reproduce, on every pull request (a push to main: MAIN below). Every job here runs on
# GitHub's own runners (macos-26 or ubuntu-latest), except `unit` on a pull request: while the org variable
# MACEM_MAC_RUNNER is set, that one runs on the org's Mac runner (never for a fork PR) when the Mac is free, and on
# macos-26 when another pull request's `unit` here already holds or waits for the Mac, so a backlog runs on both at once
# (docs/decisions.md, 2026-11-24 and 2026-11-25; the suite's tools/ci-runner). `changes` makes that choice (MAC OR GITHUB
# below). Deleting the variable puts every job back on macos-26 with no PR. On main, tags and the nightly `unit` stays on macos-26, the macOS 26
# runtime proof (the Mac runs a newer macOS).
#
# WHAT RUNS, on a pull request as ONE macOS job (`unit`), its steps cheapest first so a red one fails early and holds the
# runner no longer than it must. GitHub gives the org five macOS runners at once; three jobs per PR (until 23 Nov 2026) let
# only one or two PRs build together (the suite's engineering-process plan, process item 3):
#   * `tools/run-tests.sh inventory` — the repo's own review. Its checks are listed in tools/run-tests.sh, not
#     here, so this comment cannot go stale. It needs no sibling checkout and no reference venv. Under a minute.
#   * `tools/run-tests.sh core`      — TEMCore and TEMSession built standalone by `swift build` (Package.swift)
#     from a fresh scratch path: the layering gate. It fails the moment Core reaches into Session or either
#     reaches into the app, and on any compiler warning. About three minutes.
#   * `tools/run-tests.sh unit`      — the XCTest suite (EMStudioTests) through xcodebuild, every declared test run by name;
#     a compiler warning in the app's own sources or tests fails it (tools/lib/app-warnings.sh).
#   Each is its own step, so the job's log names the one that failed. The required check is the job, `unit (XCTest)`.
#
# MAC OR GITHUB: GitHub has no "whichever runner is free" across labels and chooses a job's runner when it is queued, so
# `changes` asks the Actions API first. The Mac takes the job unless it already holds MAC_DEPTH jobs (running and waiting)
# AND no job of this repo waits for a GitHub macOS runner; only then does it overflow to macos-26. So the Mac is never idle
# while unit jobs wait on GitHub (25 Nov: routing on "any Mac job" sent ten to GitHub's five shared slots and left the Mac
# idle), and GitHub is used only while it has room. It counts this repo's jobs and those of EMSuiteUI and 4DSTEM Studio,
# which share the Mac (public repos, readable with this run's token; #1117). Two pull requests deciding in the same second
# can both pick one side; either way the job still runs, it only waits. An API error picks the Mac. The job's log says which and why.
#
# DOCS ONLY: a pull request that changes only the root's Markdown files (README, CONTRIBUTING, ...), files under docs/
# (the store texts in docs/app-store/ among them) or the issue templates runs no macOS job (process item 3 again). The
# Linux job `changes` lists the pull request's files and says whether any needs the Mac; `unit` is then skipped, and GitHub
# counts a job skipped by its `if` as passing, so the required check `unit (XCTest)` is met with no stand-in. A doc that
# the job's tests or gates read (docs/parity.md, docs/architecture.md, ...: its path named anywhere under EMStudioTests*/,
# tools/run-tests.sh or tools/lib/) counts as code, so a pull request that edits it runs `unit`. What the skip gives up is
# the inventory's live-docs check on that pull request; the nightly runs it on main.
#
# NIGHTLY (cron 01:00 UTC) and by hand (workflow_dispatch) only, never on a push, a tag or a pull request:
#   * the unit job first restores and fetches the SEM reference datasets (tools/parity/sem/fetch-data.sh into the
#     gitignored References/sem-data, sem-parity.yml's cache), so the parity cases whose input is a fetched dataset
#     run instead of skipping: the whole-map figures F7, F11/F12 and F13 and the large SEM-EDS reader bundles. A push
#     or pull-request run skips those, and its log names them. Every run's skips are held to tools/unit-skips.allow (a
#     skip it does not list fails the gate by name); after its fetch the nightly sets MACTEM_REQUIRE_SEM_DATA=1, and
#     then a sem-data entry there allows no skip, so a figure that still skips with the data present turns it red.
#   * `tools/run-tests.sh scientific` — the TEM parity harnesses (the `scientific` array in tools/run-tests.sh is the
#     roster; no count here, so this comment cannot go stale). Each builds its harness through SwiftPM and compares
#     TEMCore against a reference it computes from the pinned Python stack: a venv that tools/lib/python.sh builds on
#     CPython 3.14 from tools/lib/references-lock.txt (the full closure, as wheels), and the pinned sources fetched
#     into the gitignored References/ (fetch-rsciio.sh, fetch-py4dstem-scattering.sh, and the beta'' CIF that
#     tools/parity/crystal-structures writes). Every harness runs even after a red one; the job fails at the end and
#     names each red one. Not a required check.
#   * `tools/run-tests.sh release-build` — the Release configuration built as tools/release.sh and tools/release-store.sh
#     archive it (generic/platform=macOS, ARCHS=arm64, MACEM_STORE_BUILD=YES), signed ad hoc with no team, never
#     notarized or uploaded, then the app checked: arm64 alone with FormatoKit's three frameworks, the version that
#     Config/Version.xcconfig sets, the privacy manifest, the export-compliance answer, the sandbox entitlements. Every
#     other build here is Debug for the concrete platform=macOS, so without it a Release-only failure first shows on the
#     owner's Mac after the tag exists. release-please.yml dispatches CI on each Release PR, so it runs there too, before
#     the merge that tags. Not a required check.
#   * `tools/run-tests.sh ui-build` — the UI journeys (EMStudioUITests) compiled and not run. On a pull request
#     ui-build.yml runs it, for the paths that can break the journeys' build, and it is not a required check there, so a
#     pull request can merge with it red; this run is what then says main no longer compiles them. Not a required check.
# The nightly's `unit` job runs `inventory` and `core` first too; the Linux jobs skip the schedule event. Dispatch CI on a branch to run
# them before merging, and on main before a tag.
#
# MAIN: a push to main runs `unit` again (inventory, core, unit), so a break between two pull requests that each passed
# alone shows on main within the hour, not at the next nightly (nightly review, 2026-11-24). A merge that changes only
# docs (DOCS ONLY, read by `changes` from the merge commit) skips it, as its pull request did. Tags, by hand and the
# nightly run it too.
#
# LIGHT (release-please.yml dispatches CI on each Release PR with `light`): the Release PR changes only the version
# files (CHANGELOG.md, .release-please-manifest.json, Config/Version.xcconfig, CITATION.cff, README.md's version line)
# on top of a main commit whose own push run passed `unit (XCTest)`, so the whole suite has already run on every line of
# code it holds. `changes` checks both; then `unit` is skipped (GitHub counts a skipped job as passing, as in DOCS ONLY)
# and `scientific` and `ui-build` do not run. `release-build` (the signed Release configuration, which reads the
# version) and the Linux jobs run. Any other file, a base commit without a green `unit` run, or a branch that is not
# release-please's: the full by-hand run, as before.
#
# XCODE: every macOS job uses Xcode 26.6 (DEVELOPER_DIR below), never the image's default, so an image update cannot
# change the toolchain on an unchanged tree.
#
# KITS: Package.swift takes the kits and MacEMUI by version range from github.com/EMSuite (public repos, no token);
# Package.resolved pins the exact versions. The SwiftPM repository cache is restored per Package.resolved so the clones
# are not fetched again on an unchanged pin set; the builds themselves start from scratch (the warnings gate needs that).
#
# EXCLUDED: on-screen verification by a person. The UI journeys run on the Mac (ui.yml); Paul's own drive of a build
# is what ships a room. And the owner's Ceta TIFFs (References/example_files/): metadata-parity gates them where they
# are present and its summary says how many; the runner has none.
#
# KNOWN CAVEATS, so a green run is not made to claim too much:
#   * CI builds with Xcode 26.6 and its macOS 26 SDK; the dev Mac builds with Xcode 27. A source that uses an API only in the macOS 27 SDK, or a Swift 6 language
#     mode diagnostic (now including a warning) only one of the two compilers emits, will part the two results;
#     that is the runner's limit, stated here, not a flake.
#   * Measured 2026-11-06 on macos-26, as separate jobs: unit 8-10 min, core about 3 min, inventory under 1 min. The one
#     job's timeout is their sum with margin.
#     The scientific job's has not been measured off the dev Mac: tighten it from the `<== name (N s)` lines its first
#     green runs print. Nor has release-build's: tighten it from its first green runs.
#   * release-build signs ad hoc, so it cannot see a certificate, provisioning or notarization failure; those stay with
#     the release scripts on the owner's Mac.

name: CI

on:
  # main and tags only: a PR branch's pushes run once, through pull_request (macEM-suite#77).
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      light:
        description: "Release PR run: skip the macOS jobs a version bump cannot change when `changes` finds it eligible (LIGHT in the header)"
        type: boolean
        default: false
  # Nightly: the unit job (inventory, core, unit) with the SEM reference data, `scientific`, `release-build` and `ui-build` (the Linux jobs skip it).
  schedule:
    - cron: "0 1 * * *"

# Read-only token: no job here writes to the repository, its issues or its PRs (checkout reads; actions/cache needs no
# token scope), except `snapshots`, which runs main's tools/lib/snapshots-publish.sh on Linux and writes only the pr-pictures branch and its PR
# comment. release-please.yml dispatches this workflow with its own token.
permissions:
  contents: read

concurrency:
  # A nightly or dispatched run (it carries `scientific`, up to three hours) has its own group, so it never queues behind,
  # or holds up, a push run on the same ref.
  group: ci-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'nightly-' || '' }}${{ github.ref }}
  # A newer push or PR run cancels the older one on the same ref, main included: a burst of merges runs `unit` once, at its
  # newest commit, which holds them all (MAIN in the header). A nightly or dispatched run always completes.
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  # Pinned: the macos-26 image's Xcode 26.6 (Swift 6.3, macOS 26 SDK). Bump on purpose.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  changes:
    # DOCS ONLY in the header: whether this pull request, or this merge to main, changes anything the macOS job checks. On
    # every other event `unit` runs as before.
    name: changes (does the PR need the macOS job)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.light)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read for MAC OR GITHUB (the other runs' jobs); nothing is written.
    permissions:
      contents: read
      actions: read
    outputs:
      macos: ${{ steps.light.outputs.macos || steps.files.outputs.macos }}
      light: ${{ steps.light.outputs.light }}
      mac: ${{ steps.mac.outputs.mac }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request's merge commit and its first parent, the base: their difference is the PR's files.
          fetch-depth: 2
      - name: List the files and decide
        id: files
        run: |
          set -euo pipefail
          macos=false
          dirs=$(ls -d EMStudioTests* tools/run-tests.sh tools/lib 2>/dev/null || true)
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [[ "$f" != */* && "$f" == *.md ]] || [[ "$f" == .github/ISSUE_TEMPLATE/* ]]; then
              echo "docs only: $f"
            elif [[ "$f" == docs/* ]]; then
              # A doc a test or a tool reads is code to them.
              if [ -n "$dirs" ] && git grep -q -F "$f" -- $dirs; then
                echo "needs macOS: $f (a test or a tool names it)"; macos=true
              else
                echo "docs only: $f"
              fi
            else
              echo "needs macOS: $f"; macos=true
            fi
          done < <(git diff --name-only --no-renames HEAD^1 HEAD)
          echo "macos=$macos" | tee -a "$GITHUB_OUTPUT"
      - name: Light run for a Release PR (LIGHT in the header)
        id: light
        if: github.event_name == 'workflow_dispatch' && inputs.light
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          light=false
          if [[ "$GITHUB_REF_NAME" != release-please--* ]]; then
            echo "not a release-please branch: the full run"
          else
            base=$(git rev-parse HEAD^1)
            others=$(git diff --name-only --no-renames HEAD^1 HEAD | grep -v -x -E 'CHANGELOG.md|\.release-please-manifest\.json|Config/Version\.xcconfig|CITATION\.cff|README\.md' || true)
            if [ -n "$others" ]; then
              echo "the Release PR also changes: $others"; echo "the full run"
            else
              run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$base&event=push&per_page=20" \
                      --jq '[.workflow_runs[] | select(.head_branch == "main")] | sort_by(.created_at) | last | .id // empty') || run=""
              ok=""
              [ -n "$run" ] && ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" \
                      --jq '.jobs[] | select(.name == "unit (XCTest)" and .conclusion == "success") | .id' || true)
              if [ -n "$ok" ]; then
                echo "the base $base passed unit (XCTest) on main (run $run): light"; light=true
              else
                echo "no passing unit (XCTest) run of main on the base $base: the full run"
              fi
            fi
          fi
          echo "light=$light" >> "$GITHUB_OUTPUT"
          if [ "$light" = true ]; then echo "macos=false" >> "$GITHUB_OUTPUT"; else echo "macos=true" >> "$GITHUB_OUTPUT"; fi
      - name: Mac or GitHub (MAC OR GITHUB in the header)
        id: mac
        if: github.event_name == 'pull_request' && vars.MACEM_MAC_RUNNER != ''
        env:
          GH_TOKEN: ${{ github.token }}
          # The Mac keeps this many jobs (the one it runs and the ones waiting for it) before a pull request overflows to GitHub.
          MAC_DEPTH: 3
        run: |
          set -uo pipefail
          # Every queued or running job of the other runs (any workflow, any event) of this repo and of the two other public repos
          # whose jobs share the Mac (EMSuiteUI and 4DSTEM Studio, #1117), as "status label-kind". The kit runner's jobs
          # (macem-kit) are another machine's and not counted.
          jobs=""
          for repo in "$GITHUB_REPOSITORY" EMSuite/EMSuiteUI EMSuite/4DSTEM-Studio; do
          for status in queued in_progress; do
            runs=$(gh api "repos/$repo/actions/runs?status=$status&per_page=100" \
                     --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id") \
              || { echo "the API did not answer for $repo: the Mac"; echo "mac=true" >> "$GITHUB_OUTPUT"; exit 0; }
            for run in $runs; do
              jobs+=$(gh api "repos/$repo/actions/runs/$run/jobs?per_page=100" --jq '.jobs[]
                  | select(.status == "queued" or .status == "in_progress")
                  | "\(.status) \(if (.labels | index("self-hosted")) and ((.labels | index("macem-kit")) | not) then "mac"
                                  elif ([.labels[] | select(startswith("macos"))] | length) > 0 then "github" else "linux" end)"' \
                  || true)$'\n'
            done
          done
          done
          mac=$(grep -c ' mac$' <<< "$jobs" || true)
          github_waiting=$(grep -c '^queued github$' <<< "$jobs" || true)
          echo "the Mac holds $mac job(s) (running and waiting); $github_waiting job(s) wait for a GitHub macOS runner"
          if [ "$mac" -ge "$MAC_DEPTH" ] && [ "$github_waiting" -eq 0 ]; then
            echo "the Mac has a queue and GitHub has a free runner: this one runs on macos-26"; echo "mac=false" >> "$GITHUB_OUTPUT"
          else
            echo "this one runs on the Mac"; echo "mac=true" >> "$GITHUB_OUTPUT"
          fi

  unit:
    # The one macOS job of a pull request: inventory, core, then the XCTest suite (WHAT RUNS in the header). Its name is
    # the required check's, kept from when it ran the suite alone.
    name: unit (XCTest)
    needs: changes
    # On a pull request, a push to main (MAIN in the header), a tag, by hand and nightly; not when a pull request or a merge
    # changes only docs (DOCS ONLY in the header). `!cancelled()` runs it although `changes` is skipped (a tag, by hand,
    # nightly) or failed (then its answer is empty and the job runs, the safe side).
    if: ${{ !cancelled() && (needs.changes.outputs.macos != 'false' || needs.changes.outputs.light == 'true') }}
    # A same-repo pull request: the org's Mac runner while MACEM_MAC_RUNNER is set and `changes` found it free (MAC OR GITHUB
    # in the header; an empty answer counts as free); anything else: GitHub's macos-26.
    runs-on: ${{ needs.changes.outputs.light == 'true' && 'ubuntu-latest' || github.event_name == 'pull_request' && vars.MACEM_MAC_RUNNER && !github.event.pull_request.head.repo.fork && needs.changes.outputs.mac != 'false' && fromJSON(vars.MACEM_MAC_RUNNER) || 'macos-26' }}
    timeout-minutes: 90
    steps:
      - name: No build left over from an earlier job (self-hosted only)
        # #1105: on 26 Nov an `xcodebuild test` of this workspace from a cancelled job (25 Nov) was still running 13 hours later
        # on the Mac and kept rewriting the workspace Package.resolved under the next jobs. The runner takes one job at a time
        # and a unit job's timeout is 90 minutes, so any xcodebuild of this workspace older than 100 minutes is such an orphan:
        # each is named and stopped by its pid. GitHub's runners start empty and skip this.
        if: needs.changes.outputs.light != 'true' && (runner.environment == 'self-hosted')
        run: |
          set -uo pipefail
          secs() { local t=$1 d=0; [[ $t == *-* ]] && { d=${t%%-*}; t=${t#*-}; }; IFS=: read -r a b c <<< "$t"
                   [ -z "$c" ] && { c=$b; b=$a; a=0; }; echo $(( 10#$d*86400 + 10#$a*3600 + 10#$b*60 + 10#$c )); }
          found=0
          while read -r pid etime cmd; do
            [[ "$cmd" == *xcodebuild* && "$cmd" == *"$GITHUB_WORKSPACE"* ]] || continue
            if [ "$(secs "$etime")" -gt 6000 ]; then
              echo "::warning::stopping a left-over build, pid $pid, running $etime: ${cmd:0:160}"; kill "$pid" || true; found=1
            fi
          done < <(ps -U "$(id -u)" -o pid=,etime=,command=)
          [ "$found" -eq 0 ] && echo "no left-over build of this workspace"
          exit 0
      - uses: actions/checkout@v7
        if: needs.changes.outputs.light != 'true'
        with:
          # mac4DSTEM's inventory reads HEAD^ on a clean tree, which the default depth of 1 does not have; its
          # job could never pass until this was set (mac4DSTEM, 2026-09-09). Kept so a rule that compares
          # against the previous commit does not repeat that.
          fetch-depth: 2
      - name: The checkout is the commit (a reused workspace keeps nothing)
        if: needs.changes.outputs.light != 'true'
        # On the self-hosted Mac the workspace and its .git persist between jobs, and on 25 Nov the workspace Package.resolved
        # read after checkout held an earlier job's pins, not the commit's (#1104's runs, #1105). This prints each tracked
        # file's index flags (h = assume-unchanged, S = skip-worktree: git then never rewrites the file), clears both flags,
        # restores every tracked file from HEAD and fails if the tree still differs from it, so stale state cannot pass a gate.
        run: |
          set -euo pipefail
          flagged=$(git ls-files -v | grep -E '^([a-z]|S) ' || true)
          if [ -n "$flagged" ]; then echo "::warning::index flags on tracked files (cleared now):"; echo "$flagged"; fi
          # Two passes: one update-index call with both options leaves a skip-worktree flag set (git 2.43, tried).
          git ls-files -z | xargs -0 git update-index --no-assume-unchanged --
          git ls-files -z | xargs -0 git update-index --no-skip-worktree --
          git ls-files -v -- '*Package.resolved'
          git checkout --force HEAD -- .
          git diff --exit-code --stat HEAD
          echo "the tree is HEAD ($(git rev-parse --short HEAD))"
      - name: Toolchain on record
        if: needs.changes.outputs.light != 'true'
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
      - name: Restore the SwiftPM repository cache
        if: needs.changes.outputs.light != 'true'
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Ensure the Metal toolchain component
        if: needs.changes.outputs.light != 'true'
        # Xcode 26 ships the Metal compiler as a separate download; the app build compiles MacEMUI's Colormaps.metal.
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version
      - name: Resolve the pinned EMSuiteUI
        if: needs.changes.outputs.light != 'true'
        # The inventory's UI-journey identifier check reads the shell's sources from .build/checkouts/EMSuiteUI (no ../EMSuiteUI here).
        run: swift package resolve
      - name: The pins are still the commit's (nothing since checkout rewrote them)
        if: needs.changes.outputs.light != 'true'
        # #1105: on the Mac, a run whose tree was HEAD after checkout read a workspace Package.resolved with other pins in the
        # inventory. This names what changed since checkout (so the log says which earlier step, or which outside process,
        # wrote it), puts both Package.resolved files back as committed, and fails if they still differ.
        run: |
          set -euo pipefail
          changed=$(git status --porcelain --untracked-files=no)
          if [ -n "$changed" ]; then
            echo "::warning::tracked files changed since checkout (restored now):"; echo "$changed"
            git diff --stat HEAD
            git diff HEAD -- '*Package.resolved' | head -80
          fi
          git checkout --force HEAD -- Package.resolved EMStudio.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          git diff --exit-code --stat HEAD -- '*Package.resolved'
          ps -axo pid,etime,command | grep -E 'xcodebuild|SWBBuildService|XCBBuildService|swift-package|Xcode.app' | grep -v grep || true
      - name: Run the inventory (cheapest first)
        if: needs.changes.outputs.light != 'true'
        run: tools/run-tests.sh inventory
      - name: Build the package layers standalone (core)
        if: needs.changes.outputs.light != 'true'
        run: tools/run-tests.sh core
      - name: Restore the SEM reference data (nightly and by hand)
        # sem-parity.yml's cache of what fetch-data.sh downloads; the next step fetches whatever it lacks.
        if: needs.changes.outputs.light != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache@v5
        with:
          path: References/sem-data
          key: sem-data-${{ hashFiles('tools/parity/sem/data-manifest.txt') }}
      - name: Fetch the SEM reference data (nightly and by hand)
        # Checked against data-manifest.txt's sha256; the Zenodo lines are "manual" and are listed, never fetched. Once the data is
        # here, a test that tools/unit-skips.allow lists as sem-data may no longer skip (tools/lib/unit-skips.sh).
        if: needs.changes.outputs.light != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          tools/parity/sem/fetch-data.sh
          echo "MACTEM_REQUIRE_SEM_DATA=1" >> "$GITHUB_ENV"
      - name: Run the unit gate
        if: needs.changes.outputs.light != 'true'
        # The room snapshots (EMStudioTests/RoomSnapshotTests, #805) compare here: TEST_RUNNER_ reaches the tests through xcodebuild.
        # Only on the org's Mac runner, where pull requests run (#957): fonts and AppKit's controls differ between macOS versions, so
        # the references are that Mac's, and GitHub's macos-26 (main, tags, the nightly, a fork's PR) skips them.
        run: tools/run-tests.sh unit
        env:
          TEST_RUNNER_SNAPSHOTS: ${{ runner.environment == 'self-hosted' && '1' || '' }}
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshots
      # New and changed snapshot pictures leave this read-only job as an artifact; the snapshots job attaches them (suite#137).
      - name: Keep new and changed snapshots for the snapshots job
        if: needs.changes.outputs.light != 'true' && (always() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork)
        uses: actions/upload-artifact@v7
        with:
          name: snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore
          retention-days: 3

  # The only job with write access, as EMSuiteUI's: it puts the unit job's new and changed room snapshots (#805) on the pr-pictures
  # branch and into one comment on the PR. Never on a fork's PR; it runs main's snapshots-publish.sh (the base commit), not the PR's, on Linux.
  snapshots:
    name: Attach new and changed snapshots to the PR
    needs: unit
    if: always() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && needs.unit.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # the pr-pictures branch
      pull-requests: write   # the snapshots comment
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: tools/lib/snapshots-publish.sh
          sparse-checkout-cone-mode: false
      # Once, while main has no publisher (the PR that brings it, #805): this repo's own PR head supplies it. Forks never get here.
      - if: hashFiles('tools/lib/snapshots-publish.sh') == ''
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: tools/lib/snapshots-publish.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        continue-on-error: true   # no artifact: no new or changed picture
        with:
          name: snapshots
          path: ${{ runner.temp }}/snapshots
      - name: Publish
        run: |
          [ -x tools/lib/snapshots-publish.sh ] || { echo "no snapshots-publish.sh on the base yet"; exit 0; }
          tools/lib/snapshots-publish.sh "$RUNNER_TEMP/snapshots" "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ github.token }}

  scientific:
    name: scientific (TEM parity harnesses)
    # Nightly and by hand only: the slowest job, and not a required check. Not on a light Release PR run (LIGHT in the header).
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.light != 'true' }}
    runs-on: macos-26
    # Margin, not measurement (mac4DSTEM's for its own roster): export-parity and sidecar-parity build many mutants.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain on record
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          swift --version
      - name: Restore the SwiftPM repository cache
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Ensure the Metal toolchain component
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version
      - name: CPython 3.14, the base of the reference venv
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Restore the reference venv
        # tools/lib/python.sh uses it only while it is exactly tools/lib/references-lock.txt, and builds it afresh otherwise.
        uses: actions/cache@v5
        with:
          path: References/python-venv
          key: python-venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('tools/lib/references-lock.txt') }}
      - name: Fetch the pinned references
        # The harnesses call the two fetch scripts themselves; run here first, a network failure is named as one. The beta''
        # CIF is written from the paper's values (tools/parity/crystal-structures), never downloaded.
        run: |
          tools/lib/fetch-rsciio.sh
          tools/lib/fetch-py4dstem-scattering.sh
          python3 -I -B tools/parity/crystal-structures/make_beta_double_prime.py
      - name: Run the scientific gate
        env:
          # Mutants run at a time in export-parity and fft-export-parity: the runner's three cores, not the dev Mac's default 6.
          MACTEM_PARITY_JOBS: 3
        run: tools/run-tests.sh scientific

  release-build:
    name: release build (Release configuration, signed ad hoc)
    # Nightly and by hand only, never on a push or a pull request: it cannot hold a PR, and it is not a required check.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    # Margin, not measurement: a whole-module Release build of the app and the kits from a cold DerivedData.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain on record
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
      - name: Restore the SwiftPM repository cache
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Ensure the Metal toolchain component
        # As in the unit job: the build compiles MacEMUI's Colormaps.metal, and Xcode 26 ships the Metal compiler separately.
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version
      - name: Build Release the way the release scripts do, and check the app
        run: tools/run-tests.sh release-build

  ui-build:
    # Named apart from ui-build.yml's job: on a pull request this one reports as skipped, and GitHub tells required checks apart by
    # job name alone, so two jobs of one name could not be required or read apart.
    name: UI journeys build, nightly (compiled, not run)
    # Nightly and by hand only: a pull request that can break the journeys' build runs this gate through ui-build.yml. Not on a
    # light Release PR run (LIGHT in the header).
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.light != 'true' }}
    runs-on: macos-26
    # Margin, not measurement (ui-build.yml's): the app and the kits at -O from a cold DerivedData, then the journeys.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain on record
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
      - name: Restore the SwiftPM repository cache
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Ensure the Metal toolchain component
        # As in the unit job: the build compiles MacEMUI's Colormaps.metal, and Xcode 26 ships the Metal compiler separately.
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version
      - name: Compile the UI journeys
        run: tools/run-tests.sh ui-build

  kit-boundary:
    name: kit boundary (no numerics frameworks in the app)
    if: github.event_name != 'schedule'
    # Plain bash, grep and awk: Linux runs it (checked with mawk), off the macOS runner queue.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fail on Accelerate / Metal / vDSP outside the allowlist
        # Decision D15. Plain grep, no build; also part of `inventory`, kept as its own job so the red is named.
        run: tools/check-kit-boundary.sh

  old-names:
    name: No old app name on screen
    if: github.event_name != 'schedule'
    # Plain bash and grep: Linux runs it, off the macOS runner queue. Also part of `inventory`, kept as its own job so the red is named.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fail on macEM, macTEM or mac4DSTEM in a string the app shows (#759)
        run: tools/check-old-names.sh

  lint:
    name: Lint (shared SwiftLint and SwiftFormat config)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: SwiftLint
        run: docker run --rm -v "$PWD:/work" -w /work --entrypoint swiftlint ghcr.io/realm/swiftlint:0.65.1 lint --strict --quiet
      - name: SwiftFormat
        run: docker run --rm -v "$PWD:/work" -w /work --entrypoint swiftformat ghcr.io/nicklockwood/swiftformat:0.64.4 --lint .

  private-refs:
    name: No private references
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files
        run: |
          if git grep -n -I -E '_archive|CLAUDE\.md|memcap|macEM-suite|setup-python-refs' -- ':!.gitignore' ':!.github/workflows/ci.yml'; then
            echo "Private references above; this repo is public."; exit 1
          fi
          # Key material: an App Store Connect key file's name, or any PEM private key. The release scripts read the key's ID
          # and issuer from the environment and the .p8 from the owner's Mac; none of it is ever committed.
          if git grep -n -I -E 'AuthKey_[A-Z0-9]{10}\.p8|BEGIN ([A-Z]+ )?PRIVATE KEY' -- ':!.github/workflows/ci.yml'; then
            echo "Key material above; it never belongs in a repository."; exit 1
          fi

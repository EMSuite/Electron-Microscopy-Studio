# Sparkle with the app-name rename (#761): tools/build-sparkle.sh on GitHub's macOS runner, its output kept as an artifact.
#
# WHY: the website download links Vendor/Sparkle/Sparkle.xcframework, Sparkle built from source at the pinned tag with
# SPARKLE_NORMALIZE_INSTALLED_APPLICATION_NAME=1, committed so every build of the app (Xcode on a Mac, every CI job, the
# release scripts) takes the same binary without building Sparkle first. This workflow is where that binary is made, from a
# public checkout, so nobody's Mac is needed and the run's URL goes into Vendor/Sparkle/build-info.txt.
#
# WHAT RUNS: tools/build-sparkle.sh into a scratch folder (it clones Sparkle at the tag, checks the commit, archives, and
# checks the compiler saw the override on each file that reads it), then the folder zipped with ditto (the framework's
# symlinks survive) as the artifact `Sparkle-<tag>-normalized`. Unzip it over Vendor/Sparkle and commit it. The run also
# lists how the build differs from the committed copy by file name (a rebuild never matches byte for byte: Mach-O UUIDs and
# signatures change), and fails nothing on that.
#
# WHEN: a push to a branch other than main that changes the pin, the script or this file, and by hand. Not on a pull
# request (the push already ran it) and not a required check: a paths-filtered workflow reports nothing outside its paths.
#
# XCODE: 26.6, as ci.yml (DEVELOPER_DIR below), never the image's default.
name: Sparkle build

on:
  push:
    branches-ignore: [main]
    paths:
      - 'tools/build-sparkle.sh'
      - 'tools/lib/sparkle-pin.sh'
      - '.github/workflows/sparkle.yml'
  workflow_dispatch:

# Read-only token: the job reads the checkout and uploads an artifact, which needs no token scope.
permissions:
  contents: read

concurrency:
  group: sparkle-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned: the macos-26 image's Xcode 26.6, ci.yml's. Bump them together, on purpose.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  build:
    name: Sparkle with the app-name rename
    runs-on: macos-26
    # Margin, not measurement: Sparkle's framework and its four helpers, Release, from a cold DerivedData.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain on record
        run: |
          sw_vers
          xcodebuild -version
      - name: Build
        run: tools/build-sparkle.sh "$RUNNER_TEMP/Sparkle"
      - name: Zip
        id: zip
        run: |
          . tools/lib/sparkle-pin.sh
          echo "name=Sparkle-$SPARKLE_TAG-normalized" >> "$GITHUB_OUTPUT"
          ditto -c -k "$RUNNER_TEMP/Sparkle" "$RUNNER_TEMP/Sparkle.zip"
          unzip -l "$RUNNER_TEMP/Sparkle.zip" | tail -1
      - name: Differences from the committed copy, by file name
        run: |
          if [[ -f Vendor/Sparkle/build-info.txt ]]; then
            diff <(awk '$1 == "sha256" { print $3 }' Vendor/Sparkle/build-info.txt) \
                 <(awk '$1 == "sha256" { print $3 }' "$RUNNER_TEMP/Sparkle/build-info.txt") && echo "Same files as the committed copy."
          else
            echo "No Vendor/Sparkle/build-info.txt committed yet."
          fi
          true
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ runner.temp }}/Sparkle.zip
          if-no-files-found: error
          retention-days: 30
